name: Addon tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua51:
    name: Lua 5.1 validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        run: |
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Run AzerCoreOps preflight
        run: ./tools/azercoreops-check
